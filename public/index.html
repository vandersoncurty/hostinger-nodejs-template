<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node.js + MySQL | Hostinger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f8fafc; color: #0f172a; line-height: 1.6; padding: 2rem; }
    .container { max-width: 700px; margin: 0 auto; }
    header { margin-bottom: 2rem; }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { color: #475569; margin-bottom: 1.5rem; }
    form { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem; background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; }
    input, textarea { padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    input:focus, textarea:focus { outline: none; border-color: #2563eb; }
    button { padding: 0.6rem 1.25rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.875rem; text-align: left; border-bottom: 1px solid #f1f5f9; }
    th { background: #f8fafc; font-weight: 600; color: #475569; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .empty { text-align: center; color: #64748b; padding: 2rem; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; background: #e2e8f0; color: #475569; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .status { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; font-size: 0.875rem; }
    .status.ok { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Node.js + MySQL</h1>
      <p>Esqueleto de aplicação com Express, MySQL e migrations automáticas, pronto para a Hostinger.</p>
    </header>

    <form id="contato-form">
      <input type="text" id="nome" name="nome" placeholder="Nome" required maxlength="100">
      <input type="email" id="email" name="email" placeholder="E-mail" required maxlength="150">
      <input type="tel" id="telefone" name="telefone" placeholder="Telefone" maxlength="20">
      <textarea id="mensagem" name="mensagem" placeholder="Mensagem" rows="3" maxlength="1000"></textarea>
      <button type="button" id="btn-enviar">Enviar contato</button>
    </form>

    <div id="status"></div>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Telefone</th>
          <th>Mensagem</th>
          <th>Criado em</th>
        </tr>
      </thead>
      <tbody id="contatos-tbody"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('contato-form');
    const btnEnviar = document.getElementById('btn-enviar');
    const tbody = document.getElementById('contatos-tbody');
    const statusDiv = document.getElementById('status');

    function mostrarStatus(msg, tipo = 'ok') {
      statusDiv.textContent = msg;
      statusDiv.className = `status ${tipo}`;
      setTimeout(() => { statusDiv.textContent = ''; }, 5000);
    }

    async function carregarContatos() {
      try {
        const res = await fetch('/api/contatos');
        const contatos = await res.json();
        tbody.innerHTML = '';
        if (contatos.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">Nenhum contato cadastrado ainda.</td></tr>';
          return;
        }
        contatos.forEach((c) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${escapeHtml(c.nome)}</td>
            <td>${escapeHtml(c.email)}</td>
            <td>${escapeHtml(c.telefone || '—')}</td>
            <td>${escapeHtml(c.mensagem || '—')}</td>
            <td><span class="badge">${new Date(c.created_at).toLocaleString('pt-BR')}</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        mostrarStatus('Erro ao carregar contatos', 'error');
      }
    }

    async function criarContato(e) {
      e.preventDefault();
      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Enviando...';

      try {
        const res = await fetch('/api/contatos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            telefone: document.getElementById('telefone').value || null,
            mensagem: document.getElementById('mensagem').value || null,
          }),
        });

        if (!res.ok) throw new Error('Erro ao criar contato');

        form.reset();
        mostrarStatus('Contato criado com sucesso!');
        carregarContatos();
      } catch (err) {
        console.error(err);
        mostrarStatus('Erro ao criar contato', 'error');
      } finally {
        btnEnviar.disabled = false;
        btnEnviar.textContent = 'Enviar contato';
      }
    }

    function escapeHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }

    form.addEventListener('submit', criarContato);
    carregarContatos();
  </script>
</body>
</html>
